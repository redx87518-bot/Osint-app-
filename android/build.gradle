buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://github.com/supabase-community/supabase-android/raw/master/releases") }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://github.com/supabase-community/supabase-android/raw/master/releases") }
    }
}
